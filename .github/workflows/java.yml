name: Java core and PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify-java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pudding_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: pudding_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pudding_test -d pudding_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package Java and resolve JDBC runtime
        run: mvn --batch-mode -f java/pom.xml package dependency:copy-dependencies -DincludeScope=runtime
      - name: Cross-language parity and real PostgreSQL
        env:
          PUDDING_TEST_ALLOW_SCHEMA: 'true'
          PUDDING_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/pudding_test
          PUDDING_TEST_DB_USER: pudding_test
          PUDDING_TEST_DB_PASSWORD: synthetic-ci-only
        run: python3 scripts/verify_java.py --postgres
      - name: Restore sandbox database and reconcile durable replay
        env:
          PUDDING_TEST_ALLOW_SCHEMA: 'true'
          PUDDING_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/pudding_test
          PUDDING_TEST_DB_USER: pudding_test
          PUDDING_TEST_DB_PASSWORD: synthetic-ci-only
          PUDDING_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 scripts/verify_sandbox_recovery.py
