name: Research core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Deterministic unit and process tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Research demo
        env:
          PYTHONPATH: src
        run: python -m flamoris_pudding demo --db /tmp/pudding-demo.sqlite3
