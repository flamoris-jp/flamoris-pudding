[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flamoris-pudding"
version = "0.1.0"
description = "Deterministic virtual pudding research with a local stdio MCP adapter"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
flamoris-pudding = "flamoris_pudding.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
